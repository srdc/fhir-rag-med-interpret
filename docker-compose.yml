version: "3.8"

services:
  fhir-rag-med:
    image: fhir-rag-med-interpret
    build: .
    container_name: fhir-rag-med-interpret-container
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"